name: FinTrack Quality Gate & CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: Code Integrity, Secret Hygiene & Static Analysis
  # ---------------------------------------------------------------------------
  static-analysis:
    name: 1. Code Integrity & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies (Strict)
        run: npm ci

      - name: Secrets & Forbidden Patterns Scan
        run: |
          echo "Scanning for accidental secret leaks or private keys..."
          # Fail if any private keys or auth tokens are committed
          if grep -rnw . -e "BEGIN RSA PRIVATE KEY" -e "BEGIN OPENSSH PRIVATE KEY" -e "BEGIN PRIVATE KEY" --exclude-dir={.git,node_modules}; then
            echo "::error::Private key detected in codebase!"
            exit 1
          fi
          echo "No secrets or private keys detected."

      - name: Code Linter (Oxlint)
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # STAGE 2: Automated Unit Tests & Accounting Invariants
  # ---------------------------------------------------------------------------
  test-and-accounting:
    name: 2. Financial Accounting & Unit Tests
    needs: [static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Suite (Unit & Migration Tests)
        run: npm test

      - name: Execute Accounting & Settlement Engine Verification
        run: npm run test:accounting

  # ---------------------------------------------------------------------------
  # STAGE 3: Production Build & PWA Asset Audit
  # ---------------------------------------------------------------------------
  build-and-audit:
    name: 3. Production Build & PWA Audit
    needs: [test-and-accounting]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle
        run: npm run build

      - name: Verify PWA Distribution & Icon Integrity
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const distDir = path.resolve("dist");
            if (!fs.existsSync(distDir)) {
              console.error("FATAL: dist directory missing!");
              process.exit(1);
            }

            // Required core files
            const requiredFiles = [
              "index.html",
              "manifest.webmanifest",
              "sw.js",
              "registerSW.js",
              "sw-notifications.js",
              "favicon.ico",
              "favicon.svg",
              "pwa-192x192.png",
              "pwa-512x512.png",
              "pwa-maskable-512x512.png",
              "apple-touch-icon.png",
              "icons8-google-wallet-material-rounded-96.png",
              "icons8-google-wallet-material-rounded-70.png"
            ];

            for (const file of requiredFiles) {
              const fullPath = path.join(distDir, file);
              if (!fs.existsSync(fullPath)) {
                console.error(`FATAL: Required PWA asset missing: ${file}`);
                process.exit(1);
              }
              const stats = fs.statSync(fullPath);
              if (stats.size === 0) {
                console.error(`FATAL: Required asset is 0 bytes: ${file}`);
                process.exit(1);
              }
            }

            // Validate manifest.webmanifest JSON and declared icons
            const manifestContent = fs.readFileSync(path.join(distDir, "manifest.webmanifest"), "utf8");
            let manifest;
            try {
              manifest = JSON.parse(manifestContent);
            } catch (err) {
              console.error("FATAL: manifest.webmanifest is invalid JSON:", err);
              process.exit(1);
            }

            if (!manifest.icons || !Array.isArray(manifest.icons) || manifest.icons.length === 0) {
              console.error("FATAL: manifest.webmanifest has no icons defined!");
              process.exit(1);
            }

            for (const icon of manifest.icons) {
              const iconPath = path.join(distDir, icon.src);
              if (!fs.existsSync(iconPath)) {
                console.error(`FATAL: Manifest references missing icon file: ${icon.src}`);
                process.exit(1);
              }
            }

            console.log("All 13 core PWA assets, manifest declarations, and fonts verified successfully!");
          '

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-production-dist
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # STAGE 4: Netlify Automated Deployment / Verification Gate
  # ---------------------------------------------------------------------------
  deploy-netlify:
    name: 4. Netlify Deployment Gate
    needs: [build-and-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Distribution
        uses: actions/download-artifact@v4
        with:
          name: fintrack-production-dist
          path: dist/

      - name: Deploy to Netlify (Live or Preview)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Netlify credentials detected! Deploying production release..."
            npx netlify-cli deploy --dir=dist --prod --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
          else
            echo "Notice: NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID not set in GitHub repository secrets."
            echo "Netlify Git-Integration / Webhook will automatically build and deploy dist/ upon push to main."
          fi
